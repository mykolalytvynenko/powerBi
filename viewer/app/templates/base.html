<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Зразки викладок{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="top">
    <a class="logo" href="/">Зразки викладок</a>
    {% if user %}<span class="who">{{ user.name or user.username }} · <a href="/logout">Вийти</a></span>{% endif %}
  </header>
  <nav class="crumbs">{% block crumbs %}{% endblock %}</nav>
  <main>{% block content %}{% endblock %}</main>
  {% block scripts %}{% endblock %}
</body>
</html>
