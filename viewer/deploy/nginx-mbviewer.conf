# /etc/nginx/sites-available/mbviewer  (замініть vitryny.example.ua на свій домен)
server {
    listen 80;
    server_name vitryny.example.ua;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name vitryny.example.ua;

    ssl_certificate     /etc/letsencrypt/live/vitryny.example.ua/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vitryny.example.ua/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
